<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Резерв ID — Отсрочка+</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#D8D4C6" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Отсрочка+" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<style>
:root{
  --bg:#EAE6D6; --card:#DED9C4; --card-border:#C3BCA2;
  --ink:#191914; --muted:#6F6E5E;
  --ribbon-bg:#6A4E1E; --ribbon-fg:#FFFFFF;
  --accent:#F5820B; --nav:#FFFFFF; --nav-active:#EFEFEC;
}
*{box-sizing:border-box}
body{font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.screen{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;padding:12px 14px calc(92px + env(safe-area-inset-bottom))}
/* Top notification pill */
.topbar{display:flex;justify-content:flex-end;margin:4px 0 10px}
.pill{display:flex;align-items:center;gap:7px;background:#fff;border-radius:999px;padding:8px 15px;
  font-size:15px;font-weight:600;color:var(--ink);border:none;-webkit-appearance:none;appearance:none;
  box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pill svg{width:20px;height:20px}
/* ID card */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;
  margin:6vh 4px auto;min-height:64vh;display:flex;flex-direction:column}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 2px}
.card-title{font-size:19px;font-weight:500}
.emblem{width:30px;height:36px;object-fit:contain}
.card-body{display:flex;gap:16px;padding:12px 18px 20px}
.photo{position:relative;width:146px;height:196px;flex:none;border-radius:8px;overflow:hidden;background:#C6C2B0;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.photo .placeholder svg{width:72px;height:72px;opacity:.5}
.photo .badge{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
.fields{display:flex;flex-direction:column;gap:22px;justify-content:flex-start;padding-top:16px;font-size:16px}
.fields>div{display:flex;flex-direction:column;gap:3px}
.fields .label{color:var(--ink);opacity:.85}
.fields .value{font-weight:600;font-size:15px}
/* Live ticker ribbon: continuous scroll to the left */
.ticker{background:var(--ribbon-bg);color:var(--ribbon-fg);overflow:hidden;white-space:nowrap;font-size:8px;
  margin-top:auto;transform:translateY(12px)}
.ticker-track{display:inline-flex;width:max-content;will-change:transform;animation:tick 14s linear infinite}
.ticker-track span{padding:2px 0}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* Name block */
.person{padding:18px 18px 20px;margin-top:auto}
.person .status{font-size:15px;color:var(--muted);margin:0 0 10px}
.person-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0}
.person-name{font-size:24px;line-height:1.25;font-weight:500;margin:0;text-align:left}
.plus{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transform:translateY(26px);padding:0}
.plus svg{width:22px;height:22px}
/* Flip: doc card <-> QR screen (3D card turn on tap / swipe) */
.stage{perspective:1400px}
.track{display:grid;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1)}
/* Rotation is driven inline in JS (cumulative angle, one direction). */
.pane{grid-area:1/1;min-width:0;display:flex;flex-direction:column;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  /* Hide the leaving side exactly at the 90-degree edge-on moment.
     Fixes Safari glitch: transformed children (ticker, plus button)
     used to shine through the opposite side mid-flip. */
  transition:visibility 0s linear .22s}
.pane-qr{transform:rotateY(180deg)}
/* Only the visible side is shown and receives taps */
.track:not(.qr) .pane-qr{visibility:hidden;pointer-events:none}
.track.qr .pane-doc{visibility:hidden;pointer-events:none}
/* QR screen — proportions traced from the reference screenshot:
   card ~91% of screen width, title 31px from top, QR ~85% of card width,
   note pinned to bottom with the same gaps as on the reference. */
.qr-card{background:#fff;border-radius:14px;margin:6vh 4px auto;min-height:64vh;display:flex;
  flex-direction:column;align-items:center;justify-content:flex-start;padding:0 24px 26px;cursor:pointer}
.qr-title{font-size:17px;font-weight:500;text-align:center;margin:31px 0 28px;line-height:1.4}
#qrFull{display:flex;justify-content:center;margin:0 0 28px;width:100%}
#qrFull img,#qrFull canvas{width:min(100%,300px);height:auto}
/* Warning note at the bottom of the QR side (matches reference) */
.qr-note{display:flex;align-items:flex-start;gap:14px;background:var(--card);border:1px solid var(--card-border);
  border-radius:10px;padding:18px 16px;margin-top:auto;width:100%}
.qr-note svg{flex:none;width:26px;height:26px;margin-top:2px}
.qr-note p{margin:0;font-size:16px;line-height:1.4;color:var(--ink);text-align:left}
/* Bottom tab bar: floating white pill (4 tabs) */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(340px,calc(100vw - 50px));background:var(--nav);border-radius:26px;z-index:30;
  display:flex;padding:8px 10px;box-shadow:0 8px 28px rgba(0,0,0,.20)}
.tab{flex:1;border:none;background:none;border-radius:18px;padding:5px 2px;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab.active{background:var(--nav-active)}
/* Menu sheet + toast */
.menu{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:40}
.menu.open{display:flex}
.menu-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:12px 16px calc(20px + env(safe-area-inset-bottom))}
.menu-box button{display:block;width:100%;text-align:left;background:none;border:none;font-size:17px;
  padding:14px 8px;border-bottom:1px solid #eee;color:var(--ink)}
.menu-box button:last-child{border-bottom:none}
.menu-box button.danger{color:#E0392B}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;display:none;z-index:50}
.toast.show{display:block}
</style>
<script src="./vendor/qrcode.min.js"></script>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <button class="pill" id="notifBtn" type="button">Сповіщення
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2Zm6-6v-5a6 6 0 0 0-4.5-5.8V4.5a1.5 1.5 0 0 0-3 0v.7A6 6 0 0 0 6 11v5l-2 2v1h16v-1l-2-2Z"/></svg>
    </button>
  </div>

  <div class="stage">
  <div class="track" id="track">
  <div class="pane pane-doc">
  <section class="card" id="docCard" aria-label="Резерв ID">
    <div class="card-head">
      <span class="card-title">Резерв ID</span>
      <img class="emblem" src="./emblem.png" alt="" width="30" height="36" />
    </div>
    <div class="card-body">
      <div class="photo" id="photoBox" title="Торкнись щоб додати фото">
        <span class="placeholder" id="photoPlaceholder">
          <svg viewBox="0 0 24 24" fill="#6E6C5C" aria-hidden="true"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5Z"/></svg>
        </span>
        <img id="photoImg" alt="Фото документа" style="display:none" />
        <span class="badge" id="photoBadge">＋</span>
        <input type="file" id="photoInput" accept="image/*" hidden />
      </div>
      <div class="fields">
        <div><div class="label">Дата<br>народження:</div><div class="value" id="dobValue">—</div></div>
        <div><div class="label">Відстрочка до:</div><div class="value" id="defValue">—</div></div>
      </div>
    </div>
    <div class="ticker" aria-label="Документи оновлено"><span class="ticker-track" id="tickerTrack"></span></div>

    <section class="person">
      <p class="status">Військовозобовʼязаний</p>
      <div class="person-row">
        <h2 class="person-name" id="personName">—</h2>
        <button class="plus" id="qrBtn" type="button" aria-label="Показати QR-код"><svg viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button>
      </div>
  </section>
  </section>
  </div>
  <div class="pane pane-qr">
    <section class="qr-card" id="qrPane" aria-label="QR-код документа">
      <p class="qr-title" id="qrValidTitle">QR-код дійсний до —</p>
      <div id="qrFull"><img src="./qr-fallback.png" alt="QR-код документа" width="340" height="340"></div>
      <aside class="qr-note" aria-label="Застереження">
        <svg viewBox="0 0 40 40" fill="none" stroke="#6F6E5E" stroke-width="1.6" aria-hidden="true">
          <rect x="3" y="3" width="34" height="34" rx="7"/>
          <text x="20" y="29" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                font-size="27" font-style="italic" fill="#6F6E5E" stroke="none">i</text>
        </svg>
        <p>Використовуйте QR-код лише за потреби та відповідально ставтеся до його поширення.</p>
      </aside>
    </section>
  </div>
  </div>
  </div>
</div>

<div class="menu" id="menuSheet">
  <div class="menu-box">
    <button type="button" id="menuEdit">Змінити дані</button>
    <button type="button" id="menuStart">На старт</button>
    <button type="button" class="danger" id="menuWipe">Видалити дані</button>
  </div>
</div>

<nav class="tabbar" aria-label="Навігація">
  <button class="tab active" type="button" data-tab="id">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 2h12a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Zm2 6v2h8V8H8Zm0 4v2h8v-2H8Z"/></svg>
    Резерв ID</button>
  <button class="tab" type="button" data-tab="services">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Сервіси</button>
  <button class="tab" type="button" data-tab="jobs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 8l3.5 3.5L12 15l-3.5-3.5L12 8Z" fill="currentColor" stroke="none"/></svg>
    Вакансії</button>
  <button class="tab" type="button" data-tab="menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    Меню</button>
</nav>

<div class="toast" id="toast"></div>

<script src="./app.js"></script>
<script>
  Otsrochka.registerServiceWorker();

  // Backward compatible: accept old ?query links too, then persist them.
  const query = new URLSearchParams(location.search);
  let person = Otsrochka.loadPerson();
  if (!person && query.get("firstName")) {
    person = {
      lastName: query.get("lastName") || "",
      firstName: query.get("firstName") || "",
      patronymic: query.get("patronymic") || "",
      dob: query.get("dob") || ""
    };
    Otsrochka.savePerson(person);
  }
  if (!person) {
    location.replace("./registration.html");
  } else {
    const nameEl = document.getElementById("personName");
    const nameLines = Otsrochka.displayNameLines(person);
    nameEl.textContent = "";
    if (nameLines.length === 0) {
      nameEl.textContent = "ПІБ не введено";
    } else {
      nameLines.forEach((line, index) => {
        if (index > 0) {
          nameEl.appendChild(document.createElement("br"));
        }
        nameEl.appendChild(document.createTextNode(line));
      });
    }
    document.getElementById("dobValue").textContent = Otsrochka.formatDateUA(person.dob);
    document.getElementById("defValue").textContent = Otsrochka.formatDateUA(person.defermentUntil);

    // Live ticker: two identical halves scrolling left in a seamless loop.
    const chunk = Otsrochka.tickerText(new Date()).repeat(3);
    const track = document.getElementById("tickerTrack");
    const first = document.createElement("span");
    first.textContent = chunk;
    const second = document.createElement("span");
    second.textContent = chunk;
    second.setAttribute("aria-hidden", "true");
    track.append(first, second);

    // Photo (stored only on this device).
    const photoImg = document.getElementById("photoImg");
    const photoPlaceholder = document.getElementById("photoPlaceholder");
    const photoBadge = document.getElementById("photoBadge");
    function renderPhoto() {
      if (person.photo) {
        photoImg.src = person.photo;
        photoImg.style.display = "block";
        photoPlaceholder.style.display = "none";
        photoBadge.style.display = "none";
      } else {
        photoImg.style.display = "none";
        photoPlaceholder.style.display = "";
        photoBadge.style.display = "";
      }
    }
    renderPhoto();
    const photoInput = document.getElementById("photoInput");
    document.getElementById("photoBox").addEventListener("click", () => photoInput.click());
    photoInput.addEventListener("change", () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) {
        return;
      }
      const img = new Image();
      img.onload = () => {
        try {
          const max = 480;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          person.photo = canvas.toDataURL("image/jpeg", 0.82);
          Otsrochka.savePerson(person);
          renderPhoto();
          toast("Фото збережено локально");
        } catch (error) {
          toast("Не вдалося зберегти фото");
        }
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    });

    // QR screen: tap center (or +) slides right to the QR page, tap it to go back.
    const slideTrack = document.getElementById("track");
    const stage = slideTrack.parentElement;
    let qrBuilt = false;
    function buildQR() {
      if (qrBuilt) {
        return;
      }
      qrBuilt = true;
      const valid = new Date();
      valid.setFullYear(valid.getFullYear() + 1);
      const MONTHS_GEN = ["січня", "лютого", "березня", "квітня", "травня", "червня",
                          "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
      document.getElementById("qrValidTitle").textContent =
        `QR-код дійсний до ${valid.getDate()} ${MONTHS_GEN[valid.getMonth()]} ${valid.getFullYear()}`;
      const box = document.getElementById("qrFull");
      try {
        const payload = JSON.stringify({
          lastName: person.lastName,
          firstName: person.firstName,
          patronymic: person.patronymic,
          dateOfBirth: person.dob
        });
        const scratch = document.createElement("div");
        new QRCode(scratch, { text: payload, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M });
        const src = scratch.querySelector("canvas");
        if (src && src.width > 0) {
          const size = 560;
          const out = document.createElement("canvas");
          out.width = size;
          out.height = size;
          const ctx = out.getContext("2d");
          ctx.imageSmoothingEnabled = false;
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, size, size);
          ctx.drawImage(src, 0, 0, size, size);
          box.textContent = "";
          box.appendChild(out);
        }
      } catch (error) {
        // Static fallback image stays visible.
      }
    }
    // Continuous rotation: always turn the same direction, never backwards.
    let flipAngle = 0;
    function flip(toQR) {
      flipAngle += 180;
      slideTrack.style.transform = `rotateY(${flipAngle}deg)`;
      slideTrack.classList.toggle("qr", toQR);
    }
    function showQR() {
      buildQR();
      if (!slideTrack.classList.contains("qr")) {
        flip(true);
      }
    }
    function showDoc() {
      if (slideTrack.classList.contains("qr")) {
        flip(false);
      }
    }
    buildQR();
    document.getElementById("qrBtn").addEventListener("click", (event) => {
      event.stopPropagation();
      showQR();
    });
    document.getElementById("docCard").addEventListener("click", (event) => {
      if (event.target.closest("#photoBox") || event.target.closest("#qrBtn") || event.target.closest("input")) {
        return;
      }
      showQR();
    });
    document.getElementById("qrPane").addEventListener("click", showDoc);
    let touchX = null;
    stage.addEventListener("touchstart", (event) => {
      touchX = event.touches[0].clientX;
    }, { passive: true });
    stage.addEventListener("touchend", (event) => {
      if (touchX === null) {
        return;
      }
      const dx = event.changedTouches[0].clientX - touchX;
      touchX = null;
      if (dx < -50) {
        showQR();
      } else if (dx > 50) {
        showDoc();
      }
    }, { passive: true });

    // Tabs.
    const menuSheet = document.getElementById("menuSheet");
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        const key = tab.dataset.tab;
        if (key === "id") {
          return;
        }
        if (key === "menu") {
          menuSheet.classList.add("open");
          return;
        }
        toast("Демо: розділ скоро");
      });
    });
    menuSheet.addEventListener("click", (event) => {
      if (event.target === menuSheet) {
        menuSheet.classList.remove("open");
      }
    });
    document.getElementById("menuEdit").addEventListener("click", () => {
      location.href = "./registration.html";
    });
    document.getElementById("menuStart").addEventListener("click", () => {
      location.href = "./index.html";
    });
    document.getElementById("menuWipe").addEventListener("click", () => {
      Otsrochka.clearPerson();
      location.href = "./index.html";
    });

    document.getElementById("notifBtn").addEventListener("click", () => toast("Демо: сповіщень немає"));
  }

  function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove("show"), 2200);
  }
</script>
</body>
</html>
