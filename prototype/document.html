<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Резерв ID — Отсрочка+</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#D8D4C6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<style>
:root{
  --bg:#D8D4C6; --card:#E4E1D3; --card-border:#C9C5B2;
  --ink:#191914; --muted:#71705F;
  --ribbon-bg:#4B3D21; --ribbon-fg:#EAD9A8;
  --accent:#F2A93B; --nav:#FFFFFF; --nav-active:#ECECEA;
}
*{box-sizing:border-box}
body{font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.screen{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
/* Top notification pill */
.topbar{display:flex;justify-content:flex-end;margin:6px 0 12px}
.pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:10px 18px;
  font-size:17px;font-weight:600;border:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pill svg{width:22px;height:22px}
/* ID card */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.card-title{font-size:19px;font-weight:500}
.trident{width:26px;height:34px}
.card-body{display:flex;gap:14px;padding:10px 16px 14px}
.photo{position:relative;width:124px;height:158px;flex:none;border-radius:10px;overflow:hidden;background:#B9B5A2;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.photo .placeholder svg{width:64px;height:64px;opacity:.55}
.photo .badge{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
.fields{display:flex;flex-direction:column;gap:10px;justify-content:center;font-size:15px}
.fields .label{color:var(--ink);opacity:.85}
.fields .value{font-weight:700}
/* Ticker ribbon with live date+time */
.ticker{background:var(--ribbon-bg);color:var(--ribbon-fg);overflow:hidden;white-space:nowrap;font-size:14px}
.ticker-track{display:inline-block;padding:7px 0;animation:tick 22s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* Name block */
.person{margin-top:14px}
.person .status{font-size:17px;color:var(--muted);margin:0 4px 8px}
.person-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px}
.person-name{font-size:29px;line-height:1.22;font-weight:800;text-transform:uppercase;margin:0}
.plus{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;
  font-size:32px;line-height:1;color:#191914;cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:10px 4px 0}
/* QR overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:40}
.overlay.open{display:flex}
.sheet{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:340px;text-align:center}
#qr{display:flex;justify-content:center;margin:12px 0}
#qr img,#qr canvas{width:220px !important;height:220px !important}
.sheet .close{margin-top:8px;background:var(--ink);color:#fff;border:none;border-radius:12px;
  padding:12px 20px;font-size:16px;font-weight:600;width:100%}
/* Bottom tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(400px,calc(100vw - 28px));background:var(--nav);border-radius:30px;z-index:30;
  display:flex;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.tab{flex:1;border:none;background:none;border-radius:22px;padding:8px 2px 7px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
.tab svg{width:27px;height:27px}
.tab.active{background:var(--nav-active)}
/* Menu sheet + toast */
.menu{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:40}
.menu.open{display:flex}
.menu-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:12px 16px calc(20px + env(safe-area-inset-bottom))}
.menu-box button{display:block;width:100%;text-align:left;background:none;border:none;font-size:17px;
  padding:14px 8px;border-bottom:1px solid #eee;color:var(--ink)}
.menu-box button:last-child{border-bottom:none}
.menu-box button.danger{color:#E0392B}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;display:none;z-index:50}
.toast.show{display:block}
</style>
<script src="./vendor/qrcode.min.js"></script>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <button class="pill" id="notifBtn" type="button">Сповіщення
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2Zm6-6v-5a6 6 0 0 0-4.5-5.8V4.5a1.5 1.5 0 0 0-3 0v.7A6 6 0 0 0 6 11v5l-2 2v1h16v-1l-2-2Z"/></svg>
    </button>
  </div>

  <section class="card" aria-label="Резерв ID">
    <div class="card-head">
      <span class="card-title">Резерв ID</span>
      <svg class="trident" viewBox="0 0 32 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
        <path d="M7 3v17c0 9 4 14 9 17 5-3 9-8 9-17V3"/>
        <path d="M16 3v24"/>
        <path d="M7 11h5M20 11h5"/>
      </svg>
    </div>
    <div class="card-body">
      <div class="photo" id="photoBox" title="Торкнись щоб додати фото">
        <span class="placeholder" id="photoPlaceholder">
          <svg viewBox="0 0 24 24" fill="#6E6C5C" aria-hidden="true"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5Z"/></svg>
        </span>
        <img id="photoImg" alt="Фото документа" style="display:none" />
        <span class="badge">＋</span>
        <input type="file" id="photoInput" accept="image/*" hidden />
      </div>
      <div class="fields">
        <div><div class="label">Дата народження:</div><div class="value" id="dobValue">—</div></div>
        <div><div class="label">Відстрочка до:</div><div class="value" id="defValue">—</div></div>
      </div>
    </div>
    <div class="ticker" aria-label="Документи оновлено"><span class="ticker-track" id="tickerTrack"></span></div>
  </section>

  <section class="person">
    <p class="status">Військовозобовʼязаний</p>
    <div class="person-row">
      <h2 class="person-name" id="personName">—</h2>
      <button class="plus" id="qrBtn" type="button" aria-label="Показати QR-код">+</button>
    </div>
    <p class="hint">Торкнись ＋ щоб показати QR-код. Торкнись фото щоб додати його (зберігається тільки на цьому пристрої).</p>
  </section>
</div>

<div class="overlay" id="qrOverlay">
  <div class="sheet" role="dialog" aria-label="QR-код документа">
    <h3 style="margin:0">QR-код документа</h3>
    <p id="qrName" style="color:var(--muted);margin:6px 0 0"></p>
    <div id="qr"></div>
    <p style="font-size:13px;color:var(--muted)">Згенеровано локально, офлайн</p>
    <button class="close" id="qrClose" type="button">Закрити</button>
  </div>
</div>

<div class="menu" id="menuSheet">
  <div class="menu-box">
    <button type="button" id="menuEdit">Змінити дані</button>
    <button type="button" id="menuStart">На старт</button>
    <button type="button" class="danger" id="menuWipe">Видалити дані</button>
  </div>
</div>

<nav class="tabbar" aria-label="Навігація">
  <button class="tab active" type="button" data-tab="id">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 2h12a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Zm2 6v2h8V8H8Zm0 4v2h8v-2H8Z"/></svg>
    Резерв ID</button>
  <button class="tab" type="button" data-tab="services">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Сервіси</button>
  <button class="tab" type="button" data-tab="jobs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 8l3.5 3.5L12 15l-3.5-3.5L12 8Z" fill="currentColor" stroke="none"/></svg>
    Вакансії</button>
  <button class="tab" type="button" data-tab="menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    Меню</button>
</nav>

<div class="toast" id="toast"></div>

<script src="./app.js"></script>
<script>
  Otsrochka.registerServiceWorker();

  // Backward compatible: accept old ?query links too, then persist them.
  const query = new URLSearchParams(location.search);
  let person = Otsrochka.loadPerson();
  if (!person && query.get("firstName")) {
    person = {
      lastName: query.get("lastName") || "",
      firstName: query.get("firstName") || "",
      patronymic: query.get("patronymic") || "",
      dob: query.get("dob") || ""
    };
    Otsrochka.savePerson(person);
  }
  if (!person) {
    location.replace("./registration.html");
  } else {
    document.getElementById("personName").textContent = Otsrochka.fullName(person) || "ПІБ не введено";
    document.getElementById("dobValue").textContent = Otsrochka.formatDateUA(person.dob);
    document.getElementById("defValue").textContent = Otsrochka.formatDateUA(person.defermentUntil);

    // Live ticker: "Документ оновлено о HH:MM | DD.MM.YYYY • " repeated.
    const chunk = Otsrochka.tickerText(new Date());
    document.getElementById("tickerTrack").textContent = chunk.repeat(4);

    // Photo (stored only on this device).
    const photoImg = document.getElementById("photoImg");
    const photoPlaceholder = document.getElementById("photoPlaceholder");
    function renderPhoto() {
      if (person.photo) {
        photoImg.src = person.photo;
        photoImg.style.display = "block";
        photoPlaceholder.style.display = "none";
      }
    }
    renderPhoto();
    const photoInput = document.getElementById("photoInput");
    document.getElementById("photoBox").addEventListener("click", () => photoInput.click());
    photoInput.addEventListener("change", () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) {
        return;
      }
      const img = new Image();
      img.onload = () => {
        try {
          const max = 480;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          person.photo = canvas.toDataURL("image/jpeg", 0.82);
          Otsrochka.savePerson(person);
          renderPhoto();
          toast("Фото збережено локально");
        } catch (error) {
          toast("Не вдалося зберегти фото");
        }
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    });

    // QR overlay on + tap.
    const overlay = document.getElementById("qrOverlay");
    let qrBuilt = false;
    document.getElementById("qrBtn").addEventListener("click", () => {
      document.getElementById("qrName").textContent = Otsrochka.fullName(person);
      if (!qrBuilt) {
        qrBuilt = true;
        const payload = JSON.stringify({
          lastName: person.lastName,
          firstName: person.firstName,
          patronymic: person.patronymic,
          dateOfBirth: person.dob
        });
        new QRCode(document.getElementById("qr"), { text: payload, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
      }
      overlay.classList.add("open");
    });
    document.getElementById("qrClose").addEventListener("click", () => overlay.classList.remove("open"));
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) {
        overlay.classList.remove("open");
      }
    });

    // Tabs.
    const menuSheet = document.getElementById("menuSheet");
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        const key = tab.dataset.tab;
        if (key === "id") {
          return;
        }
        if (key === "menu") {
          menuSheet.classList.add("open");
          return;
        }
        toast("Демо: розділ скоро");
      });
    });
    menuSheet.addEventListener("click", (event) => {
      if (event.target === menuSheet) {
        menuSheet.classList.remove("open");
      }
    });
    document.getElementById("menuEdit").addEventListener("click", () => {
      location.href = "./registration.html";
    });
    document.getElementById("menuStart").addEventListener("click", () => {
      location.href = "./index.html";
    });
    document.getElementById("menuWipe").addEventListener("click", () => {
      Otsrochka.clearPerson();
      location.href = "./index.html";
    });

    document.getElementById("notifBtn").addEventListener("click", () => toast("Демо: сповіщень немає"));
  }

  function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove("show"), 2200);
  }
</script>
</body>
</html>
